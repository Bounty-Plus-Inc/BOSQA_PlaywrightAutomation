<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standard Regression Test</title>
    <style>
      :root {
        --bg-1: #f8f5ef;
        --bg-2: #e8efe1;
        --ink: #1f2a37;
        --muted: #5d6875;
        --accent: #c3423f;
        --accent-2: #0f766e;
        --card: #ffffff;
        --line: #d9dee5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 18%, #fff2cc 0%, transparent 40%),
          radial-gradient(circle at 88% 10%, #dbeafe 0%, transparent 35%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .wrap {
        width: min(980px, 92%);
        margin: 40px auto;
      }

      .title {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0 0 26px;
        color: var(--muted);
        font-size: 1rem;
      }

      .section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 14px 30px rgba(22, 31, 43, 0.08);
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .badge {
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }

      .section h2 {
        margin: 0;
        font-size: 1.5rem;
      }

      .section p {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent-2);
        color: #fff;
      }

      .btn-secondary {
        background: #eef2f7;
        color: var(--ink);
      }

      .categories {
        margin-top: 18px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }

      .hidden {
        display: none;
      }

      .category-card {
        background: #f7fafc;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .category-card h3 {
        margin: 0;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">STANDARD AUTOMATION NI BESSIEMER :D</h1>

      <section class="section">
        <p>
          Start the Sales regression flow here. Additional suites can be added after this block.
        </p>
        <div class="actions">
          <button class="btn-primary" id="run-sales-tests" type="button">Run Sales Tests</button>
          <button class="btn-secondary" type="button">View Results</button>
        </div>
        <div class="categories hidden" id="sales-categories">
          <div class="category-card">
            <h3>Category: Standard SO : with Credit Limit Checking</h3>
          </div>
        </div>
      </section>
    </main>
    <script>
      const runSalesButton = document.getElementById('run-sales-tests');
      const salesCategories = document.getElementById('sales-categories');

      runSalesButton.addEventListener('click', () => {
        salesCategories.classList.remove('hidden');
      });
    </script>
  </body>
</html>
